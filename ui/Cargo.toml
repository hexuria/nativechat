[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/ui.rs"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
rust-embed.workspace = true

# Core dependencies from gpui-component
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
schemars = "1"
smallvec = "1"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
unicode-segmentation = "1.12.0"
regex = "1"
once_cell = "1.19.0"
paste = "1"
itertools = "0.13.0"
enum-iterator = "2.1.0"
uuid = "1.10"
num-traits = "0.2"
markdown = "1.0.0"
pulldown-cmark = "0.12"
html5ever = "0.27"
markup5ever_rcdom = "0.3.0"
chrono = "0.4.38"
aho-corasick = "1.1.3"
tree-sitter = "0.25.4"
tree-sitter-json = "0.24.8"
notify = "7.0"
tracing = "0.1"
lsp-types = "0.97.0"
rust-i18n = "3"
gpui-macros = "0.2.2"
smol = "2"

# For indoc in tests
[dev-dependencies]
indoc = "2"

[[example]]
name = "button_demo"
path = "examples/button.rs"

[[example]]
name = "input_demo"
path = "examples/input.rs"
