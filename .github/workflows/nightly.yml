name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  advisories:
    # A new RustSec advisory lands without any change to this repo. The pull request gate only sees
    # it when the next pull request opens, so main is checked every day as well.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-deny
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/cargo-deny.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cargo-deny.tgz -C /tmp
          install -m 755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny "$HOME/.local/bin/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cargo deny check advisories
        run: cargo deny --locked check advisories
