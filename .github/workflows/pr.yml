name: pr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Line tables keep file and line numbers in panics and backtraces. Full debuginfo only makes
  # compiling, linking and the rust-cache archive bigger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A new push to a pull request cancels the run it replaces. Each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml, so this is the same rustfmt as a laptop's.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  migrations:
    # The app runs every migration at launch and panics if one fails (`main.rs`, `run_migrations`
    # then `expect`). sqlx records each applied migration's checksum, so editing, renaming or
    # deleting one that has shipped makes every existing install crash on its next launch.
    # A schema change is always a new file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Migrations are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only --diff-filter=MDR "origin/${BASE}...HEAD" -- migrations/)"
          if [ -n "${changed}" ]; then
            echo "Migrations are append-only: add a new file instead of changing these:" >&2
            printf '  %s\n' ${changed} >&2
            exit 1
          fi
          echo "No shipped migration was changed."

  deny:
    # cargo deny reads Cargo.lock and the crate graph; it builds nothing, so Ubuntu is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/cargo-deny.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cargo-deny.tgz -C /tmp
          install -m 755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny "$HOME/.local/bin/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cargo deny check
        run: cargo deny --locked check

  release-features:
    # The shipped app is built with default features (`build.sh`: `cargo bundle --release`). The
    # `agent` feature compiles in gpui-agent, a TCP control plane that can click through the UI,
    # approval cards included. It must never be in that build. cargo tree only reads the graph,
    # so Ubuntu is enough; `--target` resolves it for the Macs the app is built for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gpui-agent is not in the default build
        run: |
          set -u
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            query() {
              cargo tree --locked -p nativechat -e normal --target "$target" "$@" -i gpui-agent 2>&1
            }
            # Control: with the agent feature the same query must find gpui-agent under
            # nativechat. If it cannot, the query itself is broken (a renamed package, a bad flag,
            # an unreadable graph), and a "not found" below would prove nothing.
            if ! control="$(query --features agent)" \
              || ! grep -q '^gpui-agent v' <<<"$control" \
              || ! grep -q 'nativechat v' <<<"$control"; then
              echo "$control" >&2
              echo "$target: the query cannot see gpui-agent even with the agent feature on" >&2
              exit 1
            fi
            # The release graph: only cargo's "not in the graph" answer passes. Any other failure
            # is a broken check, not a clean build.
            if release="$(query)"; then
              echo "$release" >&2
              echo "$target: gpui-agent is reachable with default features" >&2
              exit 1
            fi
            if ! grep -q 'package ID specification `gpui-agent` did not match any packages' <<<"$release"; then
              echo "$release" >&2
              echo "$target: cargo tree failed for a reason other than gpui-agent being absent" >&2
              exit 1
            fi
            echo "$target: gpui-agent is only in the agent build."
          done

  test:
    # The crate links AppKit, CoreAudio and LocalAuthentication unconditionally, so it only builds
    # on a Mac. The image is pinned rather than macos-latest: a new image brings a new Xcode SDK
    # underneath the pinned toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read main's cache and never write their own, so the cache stays one
          # warm copy of main instead of one per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-features: `agent` is the only feature, and the gpui-agent host tests
      # (src/agent/host.rs) only compile with it. Plain `cargo test` skips them.
      - name: cargo test
        run: cargo test --locked -p nativechat --all-features
      # Clippy twice: the default build compiles code `agent` switches off (`main.rs`), and
      # `agent` compiles code the default build never sees.
      - name: cargo clippy (default features)
        run: cargo clippy --locked -p nativechat --all-targets -- -D warnings
      - name: cargo clippy (all features)
        run: cargo clippy --locked -p nativechat --all-targets --all-features -- -D warnings
