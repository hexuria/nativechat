[workspace]
members = [".", "ui", "chat"]
resolver = "2"

[workspace.dependencies]
gpui = "0.2.2"
rust-embed = "8.5.0"
anyhow = "1.0"

[package]
name = "nativechat"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
rust-embed.workspace = true
rand = "0.9.2"
cpal = "0.16.0"
coreaudio-sys = "0.2.17"
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
futures = "0.3"
url = "2.5"
log = "0.4.29"
ui = { path = "ui" }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls", "stream"] }
dotenv = "0.15.0"
thiserror = "2.0"
directories = "6"
async-trait = "0.1"
uuid = { version = "1.19.0", features = ["v4", "v7", "serde", "js"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid"] }
chrono = "0.4.42"
dirs = "6.0.0"
tts = "0.26.3"
parking_lot = "0.12.5"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"

[package.metadata.bundle]
name = "NativeChat"
identifier = "com.example.nativechat"
short_description = "A native chat application."
resources = ["themes/", "assets/"]
macOS_entitlements_path = "./nativechat.entitlements"
NSMicrophoneUsageDescription = "NativeChat needs access to your microphone for voice input."
