[workspace]
members = [".", "chat"]
resolver = "2"

# GPUI layout/paint in opt-level 0 is several times slower than release.
# `cargo run` stays usable: app crate at 1, gpui/taffy/etc. at 3.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
rust-embed = "8.5.0"
anyhow = "1.0"

[package]
name = "nativechat"
version = "0.1.0"
edition = "2024"

[features]
default = []
# In-process gpui-agent mailbox for screenshots / semantic UI control.
# Product builds leave this off. Launch with `--features agent` and GPUI_AGENT=1.
agent = ["dep:gpui-agent", "dep:raw-window-handle"]

[dependencies]
gpui-kit = "0.6"
gpui-fps = "0.6"
gpui-agent = { git = "https://github.com/hexuria/gpui-agent", optional = true }
raw-window-handle = { version = "0.6", optional = true }
anyhow.workspace = true
rust-embed.workspace = true
rand = "0.9.2"
cpal = "0.16.0"
coreaudio-sys = "0.2.17"
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
base64 = "0.22.1"
futures = "0.3"
url = "2.5"
log = "0.4.29"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls", "stream", "cookies"] }
dotenv = "0.15.0"
thiserror = "2.0"
directories = "6"
async-trait = "0.1"
uuid = { version = "1.19.0", features = ["v4", "v7", "serde", "js"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid"] }
chrono = "0.4.42"
dirs = "6.0.0"
objc = "0.2"
cocoa = "0.26"
block = "0.1"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
wiremock = "0.6"
tokio = { version = "1.36", features = ["full", "test-util"] }

[package.metadata.bundle]
name = "NativeChat"
identifier = "com.example.nativechat"
short_description = "A native chat application."
resources = ["themes/", "assets/"]
macOS_entitlements_path = "./nativechat.entitlements"
NSMicrophoneUsageDescription = "NativeChat needs access to your microphone for voice input."
