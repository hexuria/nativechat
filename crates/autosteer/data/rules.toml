# Delivery cue rules (spec §6.1 / delivery-advisor-spec §4.3). Classes map 1:1 onto the
# Choice options [queue, steer, interrupt]. Scorer is Max: strongest cue wins, with a critical set.
negators = ["don't", "do not", "no need to", "no"]
negation_window = 3

[[classes]]
name = "queue"
scorer = "max"

[[classes]]
name = "steer"
scorer = "max"

[[classes]]
name = "interrupt"
scorer = "max"

[[rules]]
id = "interrupt.stop.v1"
class = "interrupt"
pattern = "stop"
weight_millis = 900
forbids = ["negation"]
version = 1

[[rules]]
id = "interrupt.cancel.v1"
class = "interrupt"
pattern = "cancel"
weight_millis = 900
forbids = ["negation"]
version = 1

