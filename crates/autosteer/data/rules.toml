# Object-scope: "stop using X" is a steer, not an interrupt. Specificity suppression makes
# the longer match win over the bare "stop".
[[rules]]
id = "steer.stop_using.v1"
class = "steer"
pattern = "stop {gerund}"
weight_millis = 850
forbids = ["negation"]
version = 1

